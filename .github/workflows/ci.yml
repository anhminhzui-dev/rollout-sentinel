name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install pytest
      - run: python -m pytest -q

  forbidden-scan:
    # The public-clean scanner lives in the test file, so it runs from a bare checkout. It
    # plants every shape it forbids and asserts each pattern fires before scanning the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pytest
      - run: python -m pytest -q -k "public_clean or no_network"

  must-refuse:
    runs-on: ubuntu-latest
    env: { PYTHONPATH: src }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The clean batch must pass (VERDICT GO, exit 0)
        run: python -m rollout_sentinel.cli analyze --rollouts fixtures/batch_clean.jsonl | grep -qx "VERDICT: GO"
      - name: The seeded deck must refuse with exit 2 and name its codes in summary.json
        run: |
          set +e
          python -m rollout_sentinel.cli analyze --rollouts fixtures/deck.jsonl --out runs/deck
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code" >&2; exit 1; }
          grep -q TEST_DISABLED runs/deck/summary.json
          grep -q MALFORMED_ROLLOUT runs/deck/summary.json
      - name: The deck must still match its pin and clear the published budget
        run: python -m rollout_sentinel.cli score --deck fixtures/deck.jsonl --budget budget.json
